<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Iconos. Hacen falta los tres formatos: Safari en iOS ignora el favicon
         SVG y busca `apple-touch-icon` para marcadores, sugerencias y pantalla
         de inicio; sin él se quedaba con el icono de Vite que cacheó de un
         despliegue anterior. El .ico cubre a los navegadores y rastreadores que
         lo piden por su nombre en la raíz, y el manifest da los de Android. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#111318" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="PitchLens" />
    <!-- viewport-fit=cover: sin esto env(safe-area-inset-*) vale 0 y la barra fija
         del CTA queda pisada por el indicador de inicio en iPhone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Tiñe el chrome del navegador móvil: sin esto Safari pinta una franja negra
         que corta el degradado del hero. -->
    <meta name="theme-color" content="#0a0a0c" />
    <title>PitchLens — Predicción de fútbol con ML</title>
    <meta name="description" content="Predicción de resultados de fútbol (1X2) con machine learning sobre 10.660 partidos de Premier League, La Liga y Bundesliga. Entrena tu propio modelo y compáralo con los preentrenados." />

    <!-- Apunta siempre a la raíz, a propósito: al ser una SPA sin SSR, todas
         las rutas sirven exactamente este mismo HTML, así que para un
         rastreador son la misma página. De paso descarta los parámetros que
         LinkedIn y WhatsApp cuelgan de la URL (?fbclid=…, ?utm_source=…), que
         si no se tratarían como direcciones distintas. -->
    <link rel="canonical" href="https://pitchlens.es/" />

    <!-- Tarjeta de enlace (LinkedIn, WhatsApp, Slack, Telegram). La imagen debe
         ir con URL absoluta: con ruta relativa, LinkedIn no la resuelve y el
         enlace sale sin previsualización. `twitter:card` hace falta aunque no
         se use Twitter — varios clientes lo miran para elegir tarjeta grande.

         Ojo: la app es una SPA sin SSR y el rastreador no ejecuta JavaScript,
         así que estas etiquetas son las de TODAS las rutas. Los <title> que
         pone React por página no los ve nadie de fuera. -->
    <meta property="og:site_name" content="PitchLens" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://pitchlens.es/" />
    <meta property="og:title" content="PitchLens — Predicción de fútbol con machine learning" />
    <meta property="og:description" content="Modelos entrenados sobre 10.660 partidos de Premier League, La Liga y Bundesliga (2015–2024). 57,3% de acierto en test frente al 45,6% de la clase mayoritaria." />
    <meta property="og:image" content="https://pitchlens.es/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PitchLens — predicción de fútbol con machine learning. 57,3% de acierto en test." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PitchLens — Predicción de fútbol con machine learning" />
    <meta name="twitter:description" content="Modelos entrenados sobre 10.660 partidos de Premier League, La Liga y Bundesliga (2015–2024). 57,3% de acierto en test." />
    <meta name="twitter:image" content="https://pitchlens.es/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
