<!doctype html>
<!--
  Plantilla de la tarjeta de enlace (public/og.png), la imagen que sale al pegar
  pitchlens.es en LinkedIn, WhatsApp o Slack.

  No entra en el build: es la fuente para regenerar el PNG cuando cambie el texto.
  Se renderiza a 1200×630 desde frontend/:

    npx playwright screenshot --viewport-size=1200,630 \
      scripts/og-card.html public/og.png

  Sale del sistema visual que ya existe, sin inventar nada:
  - La diagonal, sus dos fondos y la costura #28282d son los del hero de
    PredictorPage.tsx (HOME_BG, AWAY_BG). El VS es el mismo círculo.
  - La maqueta (marca, titular en dos líneas, bajada gris, pie) y el titular son
    los de la lámina de PitchLens del carrusel de LinkedIn.
  - Tipografía Geist y tintas de index.css. Sin degradados ni palabras resaltadas.

  El número de partidos sale de core_enriched.parquet (10.660, temporadas
  2015-2024). Si cambia, actualizar aquí, volver a renderizar y pasar la URL por
  el Post Inspector de LinkedIn, que cachea la tarjeta una semana.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("../public/fonts/GeistSans-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px;
    overflow: hidden; position: relative;
    background: #28282d;                       /* la costura de la diagonal */
    font-family: "Geist", sans-serif;
    color: oklch(0.96 0.005 268);              /* --color-ink */
  }

  /* La diagonal del hero, desplazada a la derecha para dejar sitio al texto. */
  .local {
    position: absolute; inset: 0; background: #091524;
    clip-path: polygon(0 0, 1030px 0, 894px 100%, 0 100%);
  }
  .visitante {
    position: absolute; inset: 0; background: #190909;
    clip-path: polygon(1032px 0, 100% 0, 100% 100%, 898px 100%);
  }
  .vs {
    position: absolute; left: 964px; top: 315px; transform: translate(-50%, -50%);
    width: 68px; height: 68px; border-radius: 50%;
    background: #171719; border: 1px solid #2a2a2a;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.45);
  }

  .marco {
    position: absolute; left: 0; top: 0; bottom: 0; width: 860px;
    padding: 62px 0 54px 80px;
    display: flex; flex-direction: column;
  }
  .marca { display: flex; align-items: center; gap: 14px; }
  .marca svg { width: 46px; height: 46px; }
  .marca span { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }

  h1 {
    margin-top: 70px;
    font-size: 66px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.06;
  }
  p {
    margin-top: 24px; max-width: 740px;
    font-size: 32px; line-height: 1.38;
    color: oklch(0.66 0.01 268);
  }
  .pie { margin-top: auto; font-size: 24px; color: oklch(0.58 0.01 268); }
  .pie b { font-weight: 500; color: oklch(0.82 0.008 268); }
</style>
</head>
<body>
  <div class="local"></div>
  <div class="visitante"></div>
  <div class="vs">VS</div>

  <div class="marco">
    <div class="marca">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <rect x="12" y="28" width="76" height="44" rx="14" stroke="#fff" stroke-width="4"/>
        <circle cx="50" cy="50" r="14" stroke="#fff" stroke-width="3"/>
        <line x1="50" y1="28" x2="50" y2="72" stroke="#fff" stroke-width="2.5" opacity="0.45"/>
        <circle cx="50" cy="50" r="4" fill="#fff"/>
      </svg>
      <span>PitchLens</span>
    </div>

    <h1>Un modelo propio,<br>sin escribir código</h1>
    <p>Predicción de fútbol con machine learning: eliges las variables y el algoritmo, entrenas y comparas.</p>

    <div class="pie"><b>10.660 partidos</b> · Premier League, La Liga y Bundesliga · 2015–2024</div>
  </div>
</body>
</html>
