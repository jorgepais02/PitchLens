<!doctype html>
<!--
  Plantilla de la tarjeta de enlace (public/og.png), la imagen que sale al pegar
  pitchlens.es en LinkedIn, WhatsApp o Slack.

  No entra en el build: es la fuente para regenerar el PNG cuando cambien las
  cifras. Se renderiza a 1200×630 desde frontend/:

    npx playwright screenshot --viewport-size=1200,630 \
      scripts/og-card.html public/og.png

  Las cifras salen de models/metrics.json (test accuracy del modelo market) y de
  core_enriched.parquet (10.660 partidos, temporadas 2015-2024). Si se reentrena
  o se amplía el dataset, actualizar aquí y volver a renderizar — y pasar la URL
  por el Post Inspector de LinkedIn, que cachea la tarjeta una semana.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    src: url("../public/fonts/GeistSans-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Geist Mono";
    src: url("../public/fonts/GeistMono-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px; height: 630px;
    background: #0a0a0c;
    font-family: "Geist", sans-serif;
    font-feature-settings: "ss09" 1;
    color: #f0f0f0;
    overflow: hidden;
    position: relative;
  }

  /* Eco del hero de la app: azul del local arriba, granate del visitante abajo,
     muy bajados de intensidad para que no compitan con el texto. */
  .tinte-local {
    position: absolute; inset: 0;
    background: radial-gradient(900px 500px at 12% -10%, rgba(77,147,248,0.16), transparent 60%);
  }
  .tinte-visitante {
    position: absolute; inset: 0;
    background: radial-gradient(800px 460px at 105% 115%, rgba(243,90,90,0.14), transparent 62%);
  }

  .marco {
    position: relative;
    height: 100%;
    padding: 68px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .marca { display: flex; align-items: center; gap: 18px; }
  .marca svg { width: 58px; height: 58px; }
  .marca span { font-size: 38px; font-weight: 650; letter-spacing: -0.025em; }

  h1 {
    font-size: 66px; font-weight: 700;
    letter-spacing: -0.033em; line-height: 1.08;
    max-width: 15ch;
  }
  h1 em { font-style: normal; color: #8fb4f8; }

  .pie { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }

  .datos {
    font-family: "Geist Mono", monospace;
    font-size: 21px; letter-spacing: 0.01em;
    color: rgba(255,255,255,0.42);
    line-height: 1.75;
  }
  .datos b { color: rgba(255,255,255,0.72); font-weight: 500; }

  .acierto { text-align: right; flex-shrink: 0; }
  .acierto .cifra {
    font-size: 92px; font-weight: 680; letter-spacing: -0.04em;
    line-height: 1; color: #fff;
  }
  .acierto .etiqueta {
    margin-top: 14px;
    font-family: "Geist Mono", monospace;
    font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase;
    color: rgba(255,255,255,0.40);
  }
  .acierto .contraste {
    margin-top: 7px;
    font-family: "Geist Mono", monospace;
    font-size: 18px; color: rgba(255,255,255,0.28);
  }
</style>
</head>
<body>
  <div class="tinte-local"></div>
  <div class="tinte-visitante"></div>

  <div class="marco">
    <div class="marca">
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <rect x="12" y="28" width="76" height="44" rx="14" stroke="#fff" stroke-width="4"/>
        <circle cx="50" cy="50" r="14" stroke="#fff" stroke-width="3"/>
        <line x1="50" y1="28" x2="50" y2="72" stroke="#fff" stroke-width="2.5" opacity="0.45"/>
        <circle cx="50" cy="50" r="4" fill="#fff"/>
      </svg>
      <span>PitchLens</span>
    </div>

    <h1>Predicción de fútbol con <em>machine learning</em></h1>

    <div class="pie">
      <div class="datos">
        <div>Premier League · La Liga · Bundesliga</div>
        <div><b>10.660</b> partidos · temporadas <b>2015–2024</b></div>
      </div>
      <div class="acierto">
        <div class="cifra">57,3%</div>
        <div class="etiqueta">acierto en test</div>
        <div class="contraste">clase mayoritaria: 45,6%</div>
      </div>
    </div>
  </div>
</body>
</html>
